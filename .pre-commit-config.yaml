repos:
  # ---------------------------------------------------------------------------
  # Ruff — format + lint (single tool; replaces black, isort, flake8, bugbear)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # 1. Formatter (equivalent to black)
      - id: ruff-format
        name: ruff-format
        types: [python]

      # 2. Linter with auto-fix (equivalent to flake8 + isort + bugbear + pyupgrade)
      - id: ruff
        name: ruff (lint + fix)
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]

  # ---------------------------------------------------------------------------
  # mypy — strict type checking
  # Uses the official mirrors repo so contributors don't need a global install
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (strict)
        args: [--strict]
        types: [python]
        # Provide stubs/extras that mypy needs when running in isolation
        additional_dependencies:
          - fastapi
          - pydantic
          - httpx
          - python-dotenv
          - python-json-logger
          - pytest
          - respx
          - types-requests
